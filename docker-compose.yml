services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: leaderpulse
      POSTGRES_PASSWORD: leaderpulse
      POSTGRES_DB: leaderpulse
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leaderpulse -d leaderpulse"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://leaderpulse:leaderpulse@db:5432/leaderpulse
      SECRET_KEY: local-docker-secret-change-me
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      FRONTEND_URL: http://localhost:3000
      SEED_ON_STARTUP: "true"
      PORT: "8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - api

volumes:
  pgdata:
